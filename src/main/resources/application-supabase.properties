# ============================================
# Supabase Direct PostgreSQL Database Profile
# ============================================
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Direct Supabase PostgreSQL Connection String
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.rsxttzenmxkuwrfrbkbv.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for PostgreSQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# Flyway: disabled because schema is directly deployed in Supabase SQL editor
spring.flyway.enabled=false

# Thymeleaf & Jackson
spring.thymeleaf.cache=false
spring.jackson.serialization.fail-on-empty-beans=false

# Supabase REST and Realtime Configuration
supabase.url=https://rsxttzenmxkuwrfrbkbv.supabase.co
supabase.publishable-key=sb_publishable_RkOx-OIQIHWS0kSmoj-n7A_ltEygh4V
supabase.service-key=${SUPABASE_SERVICE_KEY:}

# Application defaults
app.qr.token-validity-seconds=30
app.qr.reservation-validity-seconds=120
app.qr.token-length-bits=256
app.qr.refresh-interval-seconds=25
app.gps.default-allowed-radius-meters=50
app.gps.max-accuracy-meters=100
app.gps.max-location-age-seconds=60
app.device.max-devices-per-student=2
app.device.challenge-validity-seconds=60
app.device.algorithm=EC
app.device.ec-curve=P-256
app.attendance.low-threshold-percentage=75
app.rate-limit.scan-attempts-per-minute=10
app.rate-limit.login-attempts-per-minute=5

