<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SCSVMV Portal</title>
    <link rel="icon" type="image/png" th:href="@{/images/scsvmv-logo.png}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Design Token Styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">

<div class="login-card">
    <div class="login-brand">
        <div class="institution-crest" style="background: transparent; border: none; box-shadow: none; width: 84px; height: 84px; margin: 0 auto 0.75rem auto;">
            <img th:src="@{/images/scsvmv-logo.png}" alt="SCSVMV Portal Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h2>SCSVMV Portal</h2>
        <p>Sri Chandrasekharendra Saraswathi Viswa Mahavidyalaya &bull; Attendance Portal</p>
    </div>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert alert-danger py-2 text-sm d-flex align-items-center mb-3" role="alert" style="background-color: var(--danger-subtle); color: var(--danger-text); border-color: var(--danger-border);">
        <svg class="heroicon-sm me-2 text-danger flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
        </svg>
        <span th:text="${error}">Invalid credentials. Please verify your username and password.</span>
    </div>

    <!-- Logout Alert -->
    <div th:if="${logout}" class="alert alert-success py-2 text-sm d-flex align-items-center mb-3" role="alert" style="background-color: var(--success-subtle); color: var(--success-text); border-color: var(--success-border);">
        <svg class="heroicon-sm me-2 text-success flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        <span th:text="${logout}">You have been signed out successfully.</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">Username or Institutional ID</label>
            <div class="input-group">
                <span class="input-group-text">
                    <svg class="heroicon-sm text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                </span>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin, faculty ID, or register number" required autofocus autocomplete="username">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <svg class="heroicon-sm text-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                    </svg>
                </span>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2">
            <span>Sign In to Portal</span>
            <svg class="heroicon-sm ms-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
        </button>
    </form>
</div>
</body>
</html>
