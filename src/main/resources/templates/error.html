<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Error - SCSVMV Portal</title>
    <link rel="icon" type="image/png" th:href="@{/images/scsvmv-logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="login-card text-center" style="max-width: 460px;">
    <div class="text-danger mb-3 d-flex justify-content-center">
        <svg class="heroicon-xl text-danger" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
        </svg>
    </div>
    <h2 class="h5 font-semibold mb-2">Request Error</h2>
    <p class="text-secondary text-sm mb-4" th:text="${message} ?: 'An issue occurred while processing your request. Please return to your portal dashboard.'">
        An error occurred while processing your request.
    </p>
    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/login}" class="btn btn-primary px-3 py-2">
            <svg class="heroicon-sm me-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
            <span>Return to Portal</span>
        </a>
        <button onclick="window.history.back()" class="btn btn-outline-secondary px-3 py-2">
            Go Back
        </button>
    </div>
</div>
</body>
</html>
