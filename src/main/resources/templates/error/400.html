<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Invalid Request - SCSVMV Portal</title>
    <link rel="icon" type="image/png" th:href="@{/images/scsvmv-logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="login-card text-center" style="max-width: 460px;">
    <div class="text-secondary mb-3 d-flex justify-content-center">
        <svg class="heroicon-xl text-amber" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
    </div>
    <h2 class="h5 font-semibold mb-2">400 - Invalid Request</h2>
    <p class="text-secondary text-sm mb-4" th:text="${message} ?: 'The server could not process the request due to invalid parameters.'">
        Invalid request format.
    </p>
    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/login}" class="btn btn-primary px-3 py-2">
            <svg class="heroicon-sm me-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
            <span>Return to Portal</span>
        </a>
    </div>
</div>
</body>
</html>
