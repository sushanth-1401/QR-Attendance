# ============================================
# QR Attendance Management System
# Application Configuration
# ============================================

spring.application.name=QR Attendance Management System
spring.profiles.default=supabase

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# ============================================
# MySQL Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/qr_attendance?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=true

# ============================================
# Flyway Database Migration
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ============================================
# Jackson Configuration
# ============================================
spring.jackson.serialization.fail-on-empty-beans=false

# ============================================
# Supabase Configuration
# ============================================
supabase.url=https://rsxttzenmxkuwrfrbkbv.supabase.co
supabase.publishable-key=sb_publishable_RkOx-OIQIHWS0kSmoj-n7A_ltEygh4V

# ============================================
# QR Code Configuration
# ============================================
app.qr.token-validity-seconds=30
app.qr.reservation-validity-seconds=120
app.qr.token-length-bits=256
app.qr.refresh-interval-seconds=25

# ============================================
# GPS Configuration
# ============================================
app.gps.default-allowed-radius-meters=50
app.gps.max-accuracy-meters=100
app.gps.max-location-age-seconds=60

# ============================================
# Device Configuration
# ============================================
app.device.max-devices-per-student=2
app.device.challenge-validity-seconds=60
app.device.algorithm=EC
app.device.ec-curve=P-256

# ============================================
# Attendance Configuration
# ============================================
app.attendance.low-threshold-percentage=75

# ============================================
# Rate Limiting
# ============================================
app.rate-limit.scan-attempts-per-minute=10
app.rate-limit.login-attempts-per-minute=5

# ============================================
# Logging Configuration
# ============================================
logging.level.com.attendance=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# File Upload (if needed)
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# Supabase Database & Realtime Configuration
# ============================================
supabase.url=https://rsxttzenmxkuwrfrbkbv.supabase.co
supabase.publishable-key=sb_publishable_RkOx-OIQIHWS0kSmoj-n7A_ltEygh4V


