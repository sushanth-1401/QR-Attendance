# ============================================
# Standalone Development Profile (H2 In-Memory)
# Seamless evaluation without requiring an external MySQL daemon running
# ============================================

server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# H2 Persistent File Database with MySQL Mode
spring.datasource.url=jdbc:h2:file:./data/qr_attendance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Thymeleaf
spring.thymeleaf.cache=false

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Supabase
supabase.url=https://rsxttzenmxkuwrfrbkbv.supabase.co
supabase.publishable-key=sb_publishable_RkOx-OIQIHWS0kSmoj-n7A_ltEygh4V

# QR Configuration
app.qr.token-validity-seconds=30
app.qr.reservation-validity-seconds=120
app.qr.token-length-bits=256
app.qr.refresh-interval-seconds=25

# GPS Configuration
app.gps.default-allowed-radius-meters=50
app.gps.max-accuracy-meters=100
app.gps.max-location-age-seconds=60

# Device Configuration
app.device.max-devices-per-student=2
app.device.challenge-validity-seconds=60
app.device.algorithm=EC
app.device.ec-curve=P-256

# Attendance
app.attendance.low-threshold-percentage=75
